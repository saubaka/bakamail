name: bakamail

services:
  bakamail:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: bakamail:local
    container_name: bakamail
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    env_file:
      - ./bakamail.env
    environment:
      HOST: 0.0.0.0
      PORT: "8790"
      MADDY_RUNNER: local
      MADDY_BIN: /usr/local/bin/maddy
      MADDY_DATA_DIR: /data
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - maddydata:/data
      - bakamail-data:/app/data
      - type: bind
        source: ${MAIL_LOG_DIRECTORY:-./mail-logs}
        target: /mail-logs
        read_only: true
        bind:
          create_host_path: true
    networks:
      - mail-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8790/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  maddydata:
    external: true
    name: ${MADDY_VOLUME:-maddydata}
  bakamail-data:

networks:
  mail-network:
    external: true
    name: ${MADDY_NETWORK:-mail-network}
