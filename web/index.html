<!doctype html>
<html
  lang="zh-CN"
  data-motion="system"
  data-font-style="cloud-rounded"
  data-page-transition="stretch"
  data-dialog-style="soft"
  data-dialog-accent="#526FA6"
>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F7F9FC" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Baka Mail</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="app"></div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script>
      (function () {
        var retried = false;
        function showFatal() {
          var app = document.getElementById("app");
          var template = document.getElementById("bm-fatal");
          if (!app || !template || !template.content || app.childElementCount > 0) return;
          app.appendChild(template.content.cloneNode(true));
        }
        window.__bmFatal = showFatal;
        function retry(node, factory) {
          if (!node || !node.src || node.src.indexOf("/assets/") === -1) return;
          if (retried || node.src.indexOf("retry=") !== -1) {
            if (node.tagName === "SCRIPT") showFatal();
            return;
          }
          retried = true;
          factory(node.src + (node.src.indexOf("?") === -1 ? "?" : "&") + "retry=" + Date.now());
        }
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (!target) return;
            if (target.tagName === "SCRIPT") {
              retry(target, function (url) {
                var script = document.createElement("script");
                script.type = "module";
                script.src = url;
                document.head.appendChild(script);
              });
            } else if (target.tagName === "LINK" && (target.rel === "stylesheet" || !target.rel)) {
              retry(target, function (url) {
                var link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = url;
                document.head.appendChild(link);
              });
            }
          },
          true,
        );
        setTimeout(showFatal, 20000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
